[tox]
envlist = py3-django{4,61},flake8
isolated_build = true

[flake8]
max-complexity=8

[testenv:flake8]
deps=flake8
commands=flake8 smoketest testapp

[testenv]
deps =
  django4: Django>=4.0,<5.0
  django61: Django>=6.1,<6.2
	coveralls
	coverage
commands =
  python runtests.py

[coverage:run]
branch = True
parallel = True

[coverage:paths]
source =
    smoketest
